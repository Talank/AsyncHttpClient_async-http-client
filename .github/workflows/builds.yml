name: Build Check

on:
  workflow_dispatch:
jobs:
  Verify:
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Grant Permission
        run: chmod +x ./mvnw
      - uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '11'
      - name: Verify
        run: ./mvnw -B -ntp clean verify -DskipTests -Dgpg.skip=true

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
      fail-fast: false
  RunOnLinux:
    runs-on: ubuntu-latest
    needs: Verify
    steps:
      - uses: actions/checkout@v6
      - name: Grant Permission
        run: chmod +x ./mvnw
      - uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '11'
      - name: Run Tests
        run: ./mvnw -B -ntp test -Ddocker.tests=true

  RunOnMacOs:
    runs-on: macos-latest
    needs: Verify
    steps:
      - uses: actions/checkout@v6
      - name: Grant Permission
        run: chmod +x ./mvnw
      - uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '11'
      - name: Run Tests
        run: ./mvnw -B -ntp test

  RunOnWindows:
    runs-on: windows-latest
    needs: Verify
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '11'
      - name: Run Tests
        run: ./mvnw.cmd -B -ntp test
